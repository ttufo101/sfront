function nowTime(){ return new Date().toLocaleTimeString('zh-CN',{hour12:false}); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function appById(id){ for(var i=0;i<apps.length;i++){ if(apps[i].id===id) return apps[i]; } return apps[0]; }
function nodeById(id){ for(var i=0;i<nodes.length;i++){ if(nodes[i].id===id) return nodes[i]; } return {id:id,ip:id,name:'未知节点',type:'relay',note:'',identity:false}; }
function taskById(id){ for(var i=0;i<tasks.length;i++){ if(tasks[i].id===id) return tasks[i]; } return tasks[0]; }
function vs(appId){ return versions[appId]||[]; }
function ds(appId){ return deployments[appId]||[]; }
function dep(appId,nodeId){ var d=ds(appId); for(var i=0;i<d.length;i++){ if(d[i].nodeId===nodeId) return d[i]; } return null; }
function maxNo(appId){ var m=0,a=vs(appId); for(var i=0;i<a.length;i++){ if(a[i].no>m) m=a[i].no; } return m; }
function verNo(v){ var n=parseInt(String(v||'').replace(/^v/,''),10); return isNaN(n)?0:n; }
function deployedCount(appId,label){ var d=ds(appId),c=0; for(var i=0;i<d.length;i++){ if(d[i].version===label) c++; } return c; }
function A(n){ return '<span class="annot" data-action="open-discussion" data-q="'+n+'" title="设计依据 D'+n+'">'+n+'</span>'; }
function badge(t,tone){ return '<span class="badge '+(tone||'')+'">'+esc(t)+'</span>'; }
function toast(msg){ var root=document.getElementById('toast-root'); var d=document.createElement('div'); d.className='toast'; d.textContent=msg; root.appendChild(d); setTimeout(function(){ d.remove(); },2600); }
function meta(l,v){ return '<div><div class="meta-label">'+esc(l)+'</div><div class="meta-value mono">'+esc(v)+'</div></div>'; }
function fld(l,c,h){ return '<div class="field"><label>'+l+'</label>'+c+(h?'<div class="hint">'+h+'</div>':'')+'</div>'; }
function stat(l,v,f){ return '<div class="stat"><div class="label">'+l+'</div><div class="value">'+v+'</div><div class="foot">'+f+'</div></div>'; }
function cancelBtn(){ return '<button class="btn" data-action="close-modal">取消</button>'; }

/* ---------- 任务 ---------- */
function modeBadge(m){ var x=MODE_LABEL[m]||['—','gray']; return badge(x[0],x[1]); }
function taskRows(list){
  var rows='';
  for(var i=0;i<list.length;i++){
    var t=list[i],done=0;
    for(var j=0;j<t.items.length;j++){ if(t.items[j].status==='succeeded'||t.items[j].status==='failed') done++; }
    rows+='<tr><td class="mono">'+esc(t.id)+'</td><td>'+esc(appById(t.appId).name)+'</td><td>'+modeBadge(t.mode)+'</td><td>'+badge(t.target,'blue')+'</td>'+
      '<td>'+badge(BATCH_STATUS[t.status][0],BATCH_STATUS[t.status][1])+'</td>'+
      '<td><div class="progress '+(t.status==='failed'?'fail':'')+'"><div style="width:'+Math.round(done*100/t.items.length)+'%"></div></div><div class="hint">'+done+' / '+t.items.length+'</div></td>'+
      '<td class="mono">'+esc(t.by)+'<div class="hint">'+esc(t.start)+'</div></td>'+
      '<td><button class="btn sm" data-action="open-task" data-task="'+t.id+'">查看明细</button></td></tr>';
  }
  return rows;
}
function taskTable(list){ return '<table class="tbl"><thead><tr><th>批次</th><th>应用</th><th>类型</th><th>目标版本</th><th>状态</th><th>进度</th><th>发起人 / 开始</th><th>操作</th></tr></thead><tbody>'+taskRows(list)+'</tbody></table>'; }
function appTasksTab(a){ var list=tasks.filter(function(t){return t.appId===a.id;}); return '<div class="card"><div class="card-head"><div class="grow" style="font-weight:500">该应用的发布任务</div></div>'+taskTable(list)+'</div>'; }
function tasksPage(){
  var running=tasks.filter(function(t){return t.status==='running';}).length,failed=tasks.filter(function(t){return t.status==='failed';}).length,rbs=tasks.filter(function(t){return t.mode==='rollback';}).length;
  var list=state.taskFilter==='all'?tasks:tasks.filter(function(t){return t.mode===state.taskFilter;});
  return '<div class="page-head"><div><h1 class="page-title">发布任务</h1><div class="subtitle">异步批次，前端轮询到终态；任务类型可区分部署 / 升级 / 回滚 '+A(2)+'</div></div></div>'+
    '<div class="stats">'+stat('总批次',tasks.length,'模拟数据')+stat('进行中',running,'轮询刷新')+stat('失败批次',failed,'人工重试 / 回滚')+stat('回滚批次',rbs,'mode=rollback')+'</div>'+
    '<div class="card" style="margin-bottom:12px;padding:10px 14px;display:flex;align-items:center;gap:10px"><span class="hint">任务类型筛选</span>'+
    '<select class="select" style="width:150px;height:28px" data-action="task-filter"><option value="all"'+(state.taskFilter==='all'?' selected':'')+'>全部</option>'+
    '<option value="install"'+(state.taskFilter==='install'?' selected':'')+'>部署</option><option value="upgrade"'+(state.taskFilter==='upgrade'?' selected':'')+'>升级</option>'+
    '<option value="rollback"'+(state.taskFilter==='rollback'?' selected':'')+'>回滚</option></select>'+
    '<span class="hint">已取消「回滚此批次」：回滚统一从「已部署节点」tab 发起 '+A(4)+'</span></div>'+
    '<div class="card">'+taskTable(list)+'</div>';
}

function modalFoot(m){

  if(m.type==='wizard'||m.type==='rollback'){
    var isLast=m.step===2;

    var label=m.type==='rollback'?'提交回滚':'提交升级';

      (isLast?'<button class="btn primary" data-action="'+act+'" '+(disabled?'disabled':'')+'>'+label+'</button>':'<button class="btn primary" data-action="wizard-next" '+(m.target?'':'disabled')+'>下一步</button>');
  }

  if(m.type==='drift') return cancelBtn()+'<button class="btn primary" data-action="drift-confirm">仍然提交</button>';

/* ---------- 目标校验（逐节点） ---------- */
function checkTargets(appId,target,nodeIds,mode){
  var rows=[],blocked='',executable=0;
  for(var i=0;i<nodeIds.length;i++){
    var n=nodeById(nodeIds[i]),d=dep(appId,nodeIds[i]),cur=d?d.version:'v0';
    var diff=verNo(target)-verNo(cur),verdict='',tone='green';
    if(mode==='rollback'&&diff>0){ blocked='目标 '+target+' 高于 '+n.ip+' 当前 '+cur+'：这是升级，请走升级入口'; verdict='硬阻断'; tone='red'; }
    else if(mode==='upgrade'&&diff<=0){ blocked='升级目标必须高于 '+n.ip+' 当前 '+cur+'；旧版请走回滚入口'; verdict='硬阻断'; tone='red'; }
    else if(diff===0){ verdict='无需变更 · 自动跳过'; tone='gray'; }
    else { executable++; verdict=(mode==='rollback'&&Math.abs(diff)>1)?'跨版本降级 · 需确认':'正常执行'; tone=(mode==='rollback'&&Math.abs(diff)>1)?'orange':'green'; }
    rows.push({nodeId:nodeIds[i],ip:n.ip,name:n.name,cur:cur,verdict:verdict,tone:tone,skipped:diff===0});
  }
  return {rows:rows,blocked:blocked,executable:executable};
}
function snapshotTable(m){
  var rows='';
  for(var i=0;i<m.nodes.length;i++){
    var n=nodeById(m.nodes[i]),d=dep(m.appId,m.nodes[i]);
    rows+='<tr><td class="mono">'+esc(n.ip)+'</td><td>'+esc(n.name)+'</td><td>'+badge(TYPES[n.type],TYPE_BADGE[n.type])+'</td>'+
      '<td>'+badge(d?d.version:'—','blue')+'</td><td>'+badge(d?(d.lastSuccess||'—'):'—','green')+'</td></tr>';
  }
  return '<div class="note" style="margin-bottom:12px">以下是列表页勾选的<strong>不可变只读快照</strong>：无勾选框、不能新增节点；要调整范围请关闭弹窗回列表页修改 '+A(3)+'</div>'+
    '<table class="tbl"><thead><tr><th>服务器 IP</th><th>节点名称</th><th>类型</th><th>当前版本（实况）</th><th>上次成功</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
function versionOptions(appId,sel,mode,nodeIds){
  var v=vs(appId),s='<option value="">请选择目标版本…</option>';
  for(var i=0;i<v.length;i++){
    var lb='v'+v[i].no,ok=true;
    for(var j=0;j<nodeIds.length;j++){
      var d=dep(appId,nodeIds[j]),cur=d?d.version:'v0';
      if(mode==='upgrade'&&verNo(lb)<=verNo(cur)) ok=false;
    }
    if(!ok) continue;
    s+='<option value="'+lb+'" '+(lb===sel?'selected':'')+'>'+lb+(appById(appId).stable===lb?'（稳定版）':'')+' · '+esc(v[i].time)+' · '+esc(v[i].note)+'</option>';
  }
  return s;
}
function wizardView(m){
  var steps='<div class="steps"><div class="step '+(m.step===1?'active':'done')+'"><span class="step-num">1</span>确认范围 + 选目标版本</div>'+

  return steps+'<div class="card" style="padding:16px;margin-bottom:14px"><div style="font-weight:500;margin-bottom:8px">升级摘要</div>'+
    '<div class="meta-grid">'+meta('应用',appById(m.appId).name)+meta('节点数',m.nodes.length+' 台')+meta('目标版本',m.target)+meta('类型','升级')+'</div>'+

    fld('提交漂移校验 '+A(8),'<label style="display:flex;align-items:center;gap:6px"><input class="chk" type="checkbox" data-action="wizard-drift" '+(m.simulateDrift?'checked':'')+'> 模拟「提交时版本被他人改动」</label>')+'</div>'+
    '<div class="note warn" style="margin-bottom:12px">升级会<strong>停服重启并断开现有用户连接</strong>；中转节点建议分批、避开高峰。失败不做自动回滚，台账如实记实况版本 '+A(5)+'</div>'+
    '<div class="field"><label style="display:flex;align-items:center;gap:6px"><input class="chk" type="checkbox" data-action="wizard-confirm" '+(m.confirm?'checked':'')+'> 我已确认目标版本与断连影响</label></div>';
}
function rollbackView(m){
  var steps='<div class="steps"><div class="step '+(m.step===1?'active':'done')+'"><span class="step-num">1</span>人工指定统一目标版本</div>'+
    '<div class="step '+(m.step===2?'active':'')+'"><span class="step-num">2</span>确认影响</div></div>';
  if(m.step===1){
    var c=m.target?checkTargets(m.appId,m.target,m.nodes,'rollback'):null,extra='';
    if(c){
      extra='<div class="card" style="padding:12px 14px;margin-top:12px"><div style="font-weight:500;margin-bottom:8px">逐节点校验 '+A(4)+'</div>'+
        '<table class="tbl"><thead><tr><th>服务器 IP</th><th>当前</th><th>目标</th><th>判定</th></tr></thead><tbody>';
      for(var i=0;i<c.rows.length;i++){ var r=c.rows[i]; extra+='<tr><td class="mono">'+esc(r.ip)+'</td><td>'+badge(r.cur,'blue')+'</td><td>'+badge(m.target,'gray')+'</td><td>'+badge(r.verdict,r.tone)+'</td></tr>'; }
      extra+='</tbody></table></div>';
    }
    return steps+'<div class="note" style="margin-bottom:12px">回滚目标<strong>由人工统一指定一个版本</strong>，不预置台账推导值、不逐台覆盖；下拉给全量版本并带创建时间与说明。回滚不产生新版本 '+A(4)+'</div>'+
      '<div class="card" style="padding:14px 16px;margin-bottom:12px">'+
      fld('统一目标版本（必选）','<select class="select" data-action="rollback-target" data-node="">'+versionOptions(m.appId,m.target,'rollback',m.nodes)+'</select>',
        '目标 > 任一节点当前版本 → 硬阻断整批；等于 → 该节点跳过；跨版本降级 → 软警告')+
      (c&&c.blocked?'<div class="note warn">'+esc(c.blocked)+'：请改用升级入口</div>':(c?'<div class="note ok">可执行 '+c.executable+' 台，其余节点自动跳过</div>':''))+
      '</div>'+snapshotTable(m)+extra;
  }
  var ck=checkTargets(m.appId,m.target,m.nodes,'rollback'),lines='';
  for(var j=0;j<ck.rows.length;j++){ lines+=esc(ck.rows[j].ip)+'  '+ck.rows[j].cur+' → '+m.target+'  ['+ck.rows[j].verdict+']'; if(j<ck.rows.length-1) lines+=' ; '; }
  return steps+'<div class="card" style="padding:16px;margin-bottom:14px"><div style="font-weight:500;margin-bottom:8px">回滚摘要</div>'+
    '<div class="meta-grid">'+meta('应用',appById(m.appId).name)+meta('节点数',m.nodes.length+' 台')+meta('目标版本',m.target)+meta('类型','回滚（不产生新版本）')+'</div>'+
    '<div class="mono hint" style="margin-top:10px">'+esc(lines)+'</div></div>'+
    '<div class="form-grid">'+fld('分批并发','<select class="select" data-action="wizard-concurrency"><option value="1" '+(m.concurrency==='1'?'selected':'')+'>1 台（推荐）</option><option value="2" '+(m.concurrency==='2'?'selected':'')+'>2 台</option><option value="all" '+(m.concurrency==='all'?'selected':'')+'>全部同时</option></select>')+
    fld('提交漂移校验 '+A(8),'<label style="display:flex;align-items:center;gap:6px"><input class="chk" type="checkbox" data-action="wizard-drift" '+(m.simulateDrift?'checked':'')+'> 模拟「提交时版本被他人改动」</label>')+'</div>'+
    '<div class="note warn" style="margin-bottom:12px">回滚同样<strong>停服重启并断开现有连接</strong>；跨版本降级可能跳过中间配置变更，请确认上表判定。失败不自动回滚 '+A(4)+A(5)+'</div>'+
    '<div class="field"><label style="display:flex;align-items:center;gap:6px"><input class="chk" type="checkbox" data-action="wizard-confirm" '+(m.confirm?'checked':'')+'> 我已确认统一目标版本与断连影响</label></div>';
}

    var it=t.items[i],n=nodeById(it.nodeId),s=ITEM_STATUS[it.status]||['—','gray'];

      '<td>'+(it.reason?'<span class="hint">'+esc(it.reason)+'</span>':'<span class="hint">—</span>')+'</td>'+

    meta('发起人',t.by)+meta('开始 / 结束',t.start+' → '+(t.end||'进行中'))+meta('分批并发',t.concurrency)+meta('状态',BATCH_STATUS[t.status][0])+'</div>'+
    '<table class="tbl"><thead><tr><th>服务器 IP</th><th>版本变化</th><th>状态</th><th>失败原因</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table>'+

}

    '<div class="meta-grid" style="margin-bottom:14px">'+meta('目标 IP',n.ip)+meta('台账 node_id',n.id)+meta('identity 路径',appById(n.type==='relay'?'mihomo-relay':'hysteria2-landing').identityPath)+meta('状态','未初始化')+'</div>'+
    fld('确认 dataplane_node_id（必填）','<input class="input mono" id="f-dpid" value="'+esc(n.id)+'">',
      '不静默假设与 t_node_asset.node_id 对齐；两者可以不对齐，且不加 external_ref 映射列 '+A(7))+
    '<div class="note warn">已初始化节点会拒绝重复初始化；轮换会立即使在线节点失效，P0 不做自动轮换 '+A(7)+'</div>'+
    '<div class="field" style="margin-top:12px"><label style="display:flex;align-items:center;gap:6px"><input class="chk" type="checkbox" data-action="init-confirm" '+(m.confirm?'checked':'')+'> 我已确认该 ID 与目标机器一致，且知晓初始化只做一次</label></div>';
}
function nodeLogView(m){
  var n=nodeById(m.nodeId),d=dep(m.appId,n.id);
  return '<div class="meta-grid" style="margin-bottom:14px">'+meta('节点',n.ip)+meta('当前版本（实况）',d?d.version:'—')+meta('上次成功',d?(d.lastSuccess||'—'):'—')+meta('状态',d?d.status:'—')+'</div>'+
    '<pre class="code">['+esc(d?d.time:'—')+'] 部署台账最后一次更新\n'+
    (d&&d.status==='failed'?'[健康检查失败] 制品已替换并重启，台账如实记 current='+d.version+' / status=failed\n[处理] 人工在任务明细选择「重试」，或到「已部署节点」勾选后回滚\n':
    '[健康检查通过] current='+(d?d.version:'—')+' / status=healthy\n')+
    '[配置] 纯业务模板原文写入 conf/config.yaml（所有 service_type 同一路径，不合成身份）</pre>';
}
function driftView(m){
  return '<div class="note warn" style="margin-bottom:12px">提交时比对快照发现 <strong>'+m.drifted.length+' 台节点</strong>的当前版本与勾选时不一致 '+A(8)+'</div>'+
    '<table class="tbl"><thead><tr><th>服务器 IP</th><th>提交快照</th><th>台账实况</th></tr></thead><tbody>'+
    m.drifted.map(function(x){ return '<tr><td class="mono">'+esc(x.ip)+'</td><td>'+badge(x.snapshot,'gray')+'</td><td>'+badge(x.current,'red')+'</td></tr>'; }).join('')+
    '</tbody></table><div class="note plain" style="margin-top:12px">轻量提示，<strong>不强制锁</strong>（与客户端发布去掉 expected_release_id 的决策一致）；人工确认后二次提交。建议返回列表页刷新后再操作 '+A(8)+'</div>';
}

/* ---------- 设计依据抽屉 ---------- */
function renderDrawer(){
  var root=document.getElementById('drawer-root');
  if(!state.drawer){ root.innerHTML=''; return; }
  var cards='',lastGroup='';
  for(var i=0;i<DECISIONS.length;i++){
    var q=DECISIONS[i];
    if(q.group!==lastGroup){ cards+='<div class="hint" style="margin:'+(i?'14px':'2px')+' 0 8px">'+esc(q.group)+'</div>'; lastGroup=q.group; }
    cards+='<div class="qcard '+(state.drawerFocus===q.n?'focus':'')+'" data-action="focus-q" data-q="'+q.n+'">'+
      '<div class="qtitle">D'+q.n+' · '+esc(q.title)+'</div><div class="qbody">'+esc(q.body)+'</div><div class="qrec">'+esc(q.rec)+'</div></div>';
  }
  root.innerHTML='<div class="drawer-mask" data-action="close-drawer"></div><div class="drawer"><div class="drawer-head">'+
    '<div><div style="font-weight:500">设计依据（已定案）</div><div class="hint">事实源：release-center.md</div></div>'+
    '<button class="btn sm ghost" data-action="close-drawer">✕</button></div>'+
    '<div class="drawer-body"><div class="note" style="margin-bottom:14px">上一版「待确认 8 点」已全部拍板。已删除的作废设计：按节点渲染占位符、批次回滚、失败自动回滚、台账推导目标、逐台不同目标、failed 门禁、control/web 类型。</div>'+cards+'</div></div>';
}

/* ---------- 任务模拟 ---------- */
function createTask(appId,target,nodeIds,mode,concurrency){
  var id='B-20261114-'+String(seq++).padStart(3,'0'),items=[];
  for(var i=0;i<nodeIds.length;i++){
    var d=dep(appId,nodeIds[i]),ck=checkTargets(appId,target,[nodeIds[i]],mode);
    var skip=ck.rows[0]&&ck.rows[0].skipped;
    items.push({nodeId:nodeIds[i],from:d?d.version:'—',to:target,status:skip?'skipped':(i===0?'running':'pending'),ticks:0,
      logs:['['+nowTime()+'] '+(mode==='rollback'?'人工指定目标 '+target:'目标 '+target)+'，'+(skip?'无需变更，跳过':'入队等待节点串行锁')]});
  }
  var t={id:id,appId:appId,target:target,mode:mode,by:'admin',start:nowTime(),end:'',concurrency:concurrency||'1',status:'running',items:items};
  tasks.unshift(t);
  return t;
}
function finishItem(t,it){
  var dl=deployments[t.appId]||(deployments[t.appId]=[]),found=false;
  for(var i=0;i<dl.length;i++){
    if(dl[i].nodeId===it.nodeId){ dl[i].lastSuccess=dl[i].version; dl[i].version=it.to||t.target; dl[i].status='healthy'; dl[i].time=nowTime(); found=true; }
  }
  if(!found) dl.push({nodeId:it.nodeId,version:it.to||t.target,lastSuccess:'—',status:'healthy',time:nowTime()});
  it.logs.push('['+nowTime()+'] ELF 原子替换 + 纯业务模板原文写入完成；setup.sh status 通过；台账已更新');
}
function tick(){
  var changed=false;
  for(var i=0;i<tasks.length;i++){
    var t=tasks[i]; if(t.status!=='running') continue;
    for(var j=0;j<t.items.length;j++){
      var it=t.items[j];
      if(it.status==='running'){
        it.ticks++;
        if(it.ticks===1) it.logs.push('['+nowTime()+'] 从 MinIO 拉取制品，sha256 校验通过');
        else { it.status='succeeded'; finishItem(t,it); }
        changed=true; break;
      }
      if(it.status==='pending'){ it.status='running'; it.logs.push('['+nowTime()+'] 获得节点串行锁，开始执行'); changed=true; break; }
    }
    var unfinished=false;
    for(var k=0;k<t.items.length;k++){ if(t.items[k].status==='running'||t.items[k].status==='pending') unfinished=true; }
    if(!unfinished){ t.status=t.items.some(function(x){return x.status==='failed';})?'failed':'succeeded'; t.end=nowTime(); }
  }
  if(changed){ render(); if(state.modal&&state.modal.type==='task') renderModal(); }
}
function openWizard(){
  var ids=Array.from(state.selected);
  if(!ids.length){ toast('请先选择要升级的服务器'); return; }
  state.modal={type:'wizard',title:'批量升级 · '+appById(state.appId).name,appId:state.appId,step:1,nodes:ids,target:'',concurrency:'1',confirm:false,simulateDrift:false,wide:true};
  renderModal();
}
function openRollback(ids){
  if(!ids||!ids.length){ toast('请先选择要回滚的服务器'); return; }
  state.modal={type:'rollback',title:'批量回滚 · '+appById(state.appId).name,appId:state.appId,step:1,nodes:ids,target:'',concurrency:'1',confirm:false,simulateDrift:false,wide:true};
  renderModal();
}
function submitTask(m){
  if(m.simulateDrift){
    var drifted=[];
    for(var i=0;i<m.nodes.length;i++){
      var n=nodeById(m.nodes[i]),d=dep(m.appId,m.nodes[i]);
      drifted.push({ip:n.ip,snapshot:d?d.version:'—',current:'v'+(verNo(d?d.version:'v1')+1)});
    }
    state.modal={type:'drift',title:'检测到节点版本漂移',drifted:drifted,pending:m};
    renderModal(); return;
  }
  var mode=m.type==='rollback'?'rollback':(m.mode||'upgrade');
  var t=createTask(m.appId,m.target,m.nodes,mode,m.concurrency);
  state.modal=null; state.view='tasks'; state.taskFilter='all'; render(); renderModal();
  toast('已提交 '+MODE_LABEL[mode][0]+'批次 '+t.id+'（只读快照 '+m.nodes.length+' 台）');
}
function driftConfirm(){
  var p=state.modal.pending; p.simulateDrift=false;
  var t=createTask(p.appId,p.target,p.nodes,p.type==='rollback'?'rollback':'upgrade',p.concurrency);
  state.modal=null; state.view='tasks'; render(); renderModal();
  toast('人工确认后二次提交成功：'+t.id);
}

/* ---------- 事件 ---------- */
function onClick(a,el){
  var m=state.modal;
  switch(a){
    case 'nav-apps': state.view='apps'; state.selected.clear(); state.modal=null; render(); renderModal(); return;
    case 'nav-tasks': state.view='tasks'; state.modal=null; render(); renderModal(); return;
    case 'nav-nodes': state.view='nodes'; state.modal=null; render(); renderModal(); return;
    case 'open-app': state.view='appDetail'; state.appId=el.dataset.app; state.tab='versions'; state.selected.clear(); render(); return;
    case 'tab': state.tab=el.dataset.tab; state.selected.clear(); render(); return;
    case 'open-discussion': state.drawer=true; state.drawerFocus=parseInt(el.dataset.q||'0',10); renderDrawer(); return;
    case 'focus-q': state.drawerFocus=parseInt(el.dataset.q,10); renderDrawer(); return;
    case 'close-drawer': state.drawer=false; renderDrawer(); return;
    case 'close-modal': state.modal=null; renderModal(); return;
    case 'new-app': state.modal={type:'newApp',title:'新建应用'}; renderModal(); return;
    case 'submit-new-app': {
      var key=(document.getElementById('f-key').value||'').trim();
      if(!key){ toast('请填写应用 key'); return; }
      apps.push({id:key,key:key,name:(document.getElementById('f-name').value||key),type:document.getElementById('f-type').value,
        configName:document.getElementById('f-configname').value,configPath:document.getElementById('f-configpath').value,
        binPath:document.getElementById('f-binpath').value,lifecycle:document.getElementById('f-life').value,health:document.getElementById('f-health').value,
        identityPath:IDENTITY_BY_TYPE[document.getElementById('f-type').value],stable:'—',last:nowTime(),note:'新建（模拟）'});
      versions[key]=[]; deployments[key]=[]; state.modal=null; render(); renderModal(); toast('已创建应用 '+key+'（模拟）'); return;
    }
    case 'new-version': state.modal={type:'newVersion',title:'新建版本 · '+appById(state.appId).name,appId:state.appId}; renderModal(); return;
    case 'submit-new-version': {
      var a=appById(state.appId),no=maxNo(a.id)+1;
      versions[a.id].unshift({no:no,time:nowTime(),by:'admin',bin:'artifact-'+a.key+'-v'+no+'.tgz',size:'8.3 MB',sha:'b71e0c'+no+'…9f2a',config:'config-'+a.key+'-v'+no+'.yaml',note:(document.getElementById('f-note').value||'新建版本（模拟）')});
      if(document.getElementById('f-stable').checked) a.stable='v'+no;
      state.modal=null; render(); renderModal(); toast('已创建 v'+no+'（模拟，版本号自增）'); return;
    }
    case 'view-config': state.modal={type:'config',title:'查看配置 · '+el.dataset.ver,appId:state.appId,ver:el.dataset.ver,mode:'template',nodeId:state.configNode,showSecret:false,wide:true}; renderModal(); return;
    case 'config-mode': m.mode=el.dataset.mode; renderModal(); return;
    case 'toggle-secret': m.showSecret=!m.showSecret; renderModal(); return;
    case 'view-artifact': state.modal={type:'artifact',title:'制品详情 · '+el.dataset.ver}; renderModal(); return;
    case 'open-deploy': state.modal={type:'deploy',title:'部署 '+el.dataset.ver+' · '+appById(state.appId).name,appId:state.appId,version:el.dataset.ver,selected:new Set(),wide:true}; renderModal(); return;
    case 'toggle-deploy-node': { var id=el.dataset.node; if(m.selected.has(id)) m.selected.delete(id); else m.selected.add(id); renderModal(); return; }
    case 'submit-deploy': {
      var missing=[];
      m.selected.forEach(function(id){ if(!nodeById(id).identity) missing.push(nodeById(id).ip); });
      if(missing.length){ toast('identity 前置未满足：'+missing.join(', ')+'，请先初始化节点身份'); return; }
      var t=createTask(m.appId,m.version,Array.from(m.selected),'install','1');
      state.modal=null; state.view='tasks'; render(); renderModal(); toast('已提交部署批次 '+t.id); return;
    }
    case 'toggle-row': { var nid=el.dataset.node; if(state.selected.has(nid)) state.selected.delete(nid); else state.selected.add(nid); render(); return; }
    case 'select-all': { var dd=ds(state.appId); for(var q=0;q<dd.length;q++) state.selected.add(dd[q].nodeId); render(); return; }
    case 'wizard-one': state.selected=new Set([el.dataset.node]); openWizard(); return;
    case 'open-wizard': openWizard(); return;
    case 'rollback-one': openRollback([el.dataset.node]); return;
    case 'open-rollback': openRollback(Array.from(state.selected)); return;
    case 'goto-rollback': {
      state.modal=null; state.view='appDetail'; state.tab='deployments';
      state.selected=new Set([el.dataset.node]); render(); renderModal();
      openRollback([el.dataset.node]); toast('已预选该节点，请在回滚向导里人工指定目标版本'); return;
    }
    case 'wizard-next': {
      var ck=checkTargets(m.appId,m.target,m.nodes,m.type==='rollback'?'rollback':'upgrade');
      if(ck.blocked){ toast(ck.blocked); return; }
      if(!ck.executable){ toast('全部节点均无需变更，整批拒绝'); return; }
      m.step=2; renderModal(); return;
    }
    case 'wizard-prev': m.step=1; renderModal(); return;
    case 'submit-wizard': submitTask(m); return;
    case 'submit-rollback': submitTask(m); return;
    case 'open-task': state.modal={type:'task',title:'任务明细 · '+el.dataset.task,taskId:el.dataset.task,wide:true}; renderModal(); return;
    case 'retry-item': {
      var tt=taskById(el.dataset.task);
      for(var r=0;r<tt.items.length;r++){ if(tt.items[r].nodeId===el.dataset.node){ tt.items[r].status='running'; tt.items[r].ticks=0; tt.items[r].reason=''; tt.items[r].logs.push('['+nowTime()+'] 人工重试：同一批次续跑'); } }
      tt.status='running'; tt.end=''; renderModal(); toast('已重新入队（同一批次续跑，不产生新批次）'); return;
    }
    case 'item-log': {
      var it2=null,ta=taskById(el.dataset.task);
      for(var z=0;z<ta.items.length;z++){ if(ta.items[z].nodeId===el.dataset.node) it2=ta.items[z]; }
      state.modal={type:'nodeLog',title:'节点执行日志 · '+nodeById(el.dataset.node).ip,appId:ta.appId,nodeId:el.dataset.node,
        logHtml:'<pre class="code">'+esc((it2?it2.logs:['暂无日志']).join('\n'))+'</pre>',wide:true};
      renderModal(); return;
    }
    case 'node-log': { var lg=nodeLogView({appId:state.appId,nodeId:el.dataset.node}); state.modal={type:'nodeLog',title:'节点部署记录 · '+nodeById(el.dataset.node).ip,appId:state.appId,nodeId:el.dataset.node,logHtml:lg,wide:true}; renderModal(); return; }
    case 'init-identity': state.modal={type:'initIdentity',title:'初始化节点身份 · '+nodeById(el.dataset.node).ip,nodeId:el.dataset.node,confirm:false}; renderModal(); return;
    case 'submit-init-identity': {
      var n2=nodeById(m.nodeId); n2.identity=true; state.modal=null; render(); renderModal();
      toast('已初始化（模拟）：明文未回显，审计仅记 node_id'); return;
    }
    case 'drift-confirm': driftConfirm(); return;
  }
}
function onChange(a,t){
  var m=state.modal;
  if(a==='filter-version'){ state.filter=t.value; render(); return; }
  if(a==='task-filter'){ state.taskFilter=t.value; render(); return; }
  if(a==='config-node'){ m.nodeId=t.value; state.configNode=t.value; renderModal(); return; }
  if(a==='wizard-target'||a==='rollback-target'){ m.target=t.value; renderModal(); return; }
  if(a==='wizard-concurrency'){ m.concurrency=t.value; renderModal(); return; }
  if(a==='wizard-confirm'){ m.confirm=t.checked; renderModal(); return; }
  if(a==='wizard-drift'){ m.simulateDrift=t.checked; renderModal(); return; }
  if(a==='init-confirm'){ m.confirm=t.checked; renderModal(); return; }
}
function bind(){
  document.addEventListener('click',function(e){
    var el=e.target.closest?e.target.closest('[data-action]'):null;
    if(!el) return;
    var a=el.dataset.action;
    if(a==='close-modal'||a==='close-drawer'||a==='open-discussion'||a==='focus-q'){ onClick(a,el); return; }
    onClick(a,el);
  });
  document.addEventListener('change',function(e){
    var el=e.target.closest?e.target.closest('[data-action]'):null;
    if(!el) return;
    onChange(el.dataset.action,el);
  });
  setInterval(tick,1600);
}
if(typeof document!=='undefined'&&document.getElementById('app')){ render(); renderModal(); renderDrawer(); bind(); }
</script>
